<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학교시설공사 AI 챗봇</title>
</head>
<body>
<div id="loading" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;line-height:1.6">학교시설공사 AI 챗봇을 불러오는 중...</div>
<script>
(async () => {
  try {
    const parts = await Promise.all([0,1,2,3].map(async (i) => {
      const r = await fetch(`payload${i}.txt`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`payload${i}.txt 로드 실패 (${r.status})`);
      return (await r.text()).trim();
    }));

    const b64 = parts.join('');
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

    if (!('DecompressionStream' in window)) {
      throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome 또는 Edge를 사용해 주세요.');
    }

    const ds = new DecompressionStream('gzip');
    const html = await new Response(
      new Blob([bin]).stream().pipeThrough(ds)
    ).text();

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    const msg = String(e && e.message ? e.message : e);
    document.body.innerHTML = `<pre style="white-space:pre-wrap;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;line-height:1.6">앱 로딩 오류: ${msg}</pre>`;
  }
})();
</script>
</body>
</html>
